<style>

table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:12.5px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff}
tbody tr:nth-child(even) td{background:var(--bg)}

th{font-weight:700;color:var(--navy);font-size:11px;letter-spacing:.8px;text-transform:uppercase;border-bottom:1px solid var(--navy)}

.act ol{list-style:none;margin:0;padding:0}.act li{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.act li:first-child{border-top:0}
.act .tg,.act .tg.r,.act .tg.g{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.8px}
.act .im{font-size:12px;font-weight:700;color:var(--navy);text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:640px){.act li{grid-template-columns:1fr}.act .im{text-align:left}h1{font-size:30px}}
footer{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;color:var(--royal);font-size:12px;border-top:1px solid var(--navy);padding-top:12px}
footer .nm{font-size:8pt;color:var(--navy);letter-spacing:.8px;white-space:nowrap}
</style></head><body>

 ["2024 overheads: firm P&L vs overhead schedule", 3420, 3420, true], ["2023 overheads: firm P&L vs overhead schedule", 2970, 2970, true], ["2026 YTD salaries: payroll file vs summary", 760, 760, true], ["2026 YTD bonus accrual: payroll file vs summary", 560, 560, true], ["Earnings rebuild fy23", 4470, 4470, true], ["Earnings rebuild fy24", 8960, 8960, true], ["Earnings rebuild fy25", 8910, 8910, true], ["Earnings rebuild ytd", 6875, 6875, true], ["Earnings rebuild bud", 9350, 9350, true], ["Earnings rebuild uw", 10720, 10720, true], ["Headcount: producers + support = total fy23", 12, 12, true], ["Headcount: producers + support = total fy24", 14, 14, true], ["Headcount: producers + support = total fy25", 15, 15, true], ["Headcount: producers + support = total ytd", 15, 15, true], ["Headcount: producers + support = total bud", 15, 15, true]], "asof": "Sep 2026 YTD (Jan to Sep 2026)", "filedate": "Oct 2026"};

function bars(title,note,vals,fmtv,opt={}){ // vals: [{k,v}]

 const base=f=>({2023:M[f].fy23,2024:M[f].fy24,2025:M[f].fy25,2026:M[f].bud});
 // One year of the deal. Operating earnings are revenue less the support we provide and occupancy;
 // payments to the partners are consideration, not an operating cost, so they sit in the investment line.
 function build(a){
  const g=1+a.grow/100,t=a.tax/100,R=base('rev'),S=base('support'),C=base('corp'),E=base('commexp');

   for(let y=Y0;y<=YN;y++){
    const n=y-2026,m=Math.max(0,y-2024),ramp=y===2023?.6:1;   // underwriting assumed a part-year 2023
    const p=(act,uwv)=>uw?uwv*ramp*Math.pow(g,m):(y<=2026?act[y]:act[2026]*Math.pow(g,n));
    const rev=p(R,M.rev.uw),sup=p(S,M.support.uw),occ=p(C,M.corp.uw),pay=p(E,M.commexp.uw);
    const ebt=rev-sup-occ;
    L.push({y,rev,sup,occ,ebt,tax:ebt*t,ocf:ebt*(1-t),pay:y>a.eoEnd?0:pay,act:!uw&&y<=2025,bud:!uw&&y===2026})}
   const last=L[L.length-1];last.tv=last.ebt*a.exit;
   L.forEach(r=>r.net=r.ocf-r.pay+(r.tv||0));
   return L};
  return{cur:mk(0),uw:mk(1)}}
 const flows=(L,a)=>[-a.close].concat(L.map(r=>r.net));

  f.forEach((x,i)=>{c+=x;if(pb===null&&i>0&&c>=0)pb=i;d+=x/Math.pow(1+r,i);if(dpb===null&&i>0&&d>=0)dpb=i});

   for(let i=0;i<=4;i++){const q=mn+(mx-mn)*i/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(q)}" y2="${y(q)}" stroke="var(--line)"/><text class="m" x="${pl-6}" y="${y(q)+4}" text-anchor="end">${fmt(q/1000,0)}</text>`}
   s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--navy)" stroke-width="1.5"/>`;
   [[uu,'var(--warn)','Underwriting'],[cc,'var(--y26)','Where it stands']].forEach(([a,col])=>{
    s+=`<polyline fill="none" stroke="${col}" stroke-width="2.2" points="${a.map((q,i)=>x(i)+','+y(q)).join(' ')}"/>`;
    a.forEach((q,i)=>s+=`<circle cx="${x(i)}" cy="${y(q)}" r="2.6" fill="${col}"><title>${i===0?'At close':Y0+i-1}: ${fmt(q)}K</title></circle>`)});
   if(c.dpb!=null)s+=`<line x1="${x(c.dpb)}" x2="${x(c.dpb)}" y1="${pt}" y2="${H-pb}" stroke="var(--blue)" stroke-dasharray="4 3"/><text class="m" x="${x(c.dpb)+4}" y="${pt+10}" style="fill:var(--blue);font-weight:700">payback ${Y0+c.dpb-1}</text>`;
   for(let i=0;i<cc.length;i+=2)s+=`<text class="m" x="${x(i)}" y="${H-8}" text-anchor="middle" style="font-size:10px">${i===0?'Close':Y0+i-1}</text>`;
   g.append($(`<div class="card"><h2>Cumulative discounted cash flow</h2><p class="note">$M at ${A.disc}%. The line crosses zero at discounted payback; where it ends is NPV.</p>${s+'</svg>'}<div class="leg"><span><i style="background:var(--warn)"></i>Underwriting</span><span><i style="background:var(--y26)"></i>Where it stands</span></div></div>`))})();

  // NPV bridge
  (function(){const d=(q,i)=>q/Math.pow(1+r,i+1);let rv=0,sp=0,oc=0,pay=0;
   B.uw.forEach((w,i)=>{const z=B.cur[i];rv+=d((z.rev-w.rev)*(1-t),i);sp+=d(-(z.sup-w.sup)*(1-t),i);oc+=d(-(z.occ-w.occ)*(1-t),i);pay+=d(-(z.pay-w.pay),i)});
   const tv=d(c.tv-u.tv,HOLD-1);
   const st=[['Fee revenue',rv],['Support we provide',sp],['Occupancy',oc],['Payments to partners',pay],['Terminal value',tv]];
   const W=520,H=290,pl=10,pr=10,pt=24,pb=56,n=st.length+2,gw=(W-pl-pr)/n,bw=gw*.58;
   const pts=[u.npv,c.npv];let run=u.npv;st.forEach(x=>{run+=x[1];pts.push(run)});
   const mx=Math.max(...pts,0)*1.12,mn=Math.min(...pts,0)*1.1,y=q=>pt+(mx-q)/(mx-mn)*(H-pt-pb);
   let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="NPV bridge"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--mute)"/>`;
   const bar=(i,a,b,col,txt,lab)=>{const x=pl+i*gw+(gw-bw)/2,y0=y(Math.max(a,b)),h=Math.max(2,Math.abs(y(a)-y(b)));
    const w=lab.split(' '),half=Math.ceil(w.length/2);
    s+=`<rect x="${x}" y="${y0}" width="${bw}" height="${h}" fill="${col}"/><text x="${x+bw/2}" y="${y0-6}" text-anchor="middle" style="font-weight:700;font-size:11px">${txt}</text>`+
       `<text class="m" x="${x+bw/2}" y="${H-32}" text-anchor="middle" style="font-size:10px">${w.slice(0,half).join(' ')}</text><text class="m" x="${x+bw/2}" y="${H-20}" text-anchor="middle" style="font-size:10px">${w.slice(half).join(' ')}</text>`};
   bar(0,0,u.npv,'var(--warn)',$M(u.npv),'Underwriting NPV');
   let cur2=u.npv;st.forEach(([l,q],i)=>{bar(i+1,cur2,cur2+q,q>=0?'var(--good)':'var(--bad)',sgn(q/1000,1),l);cur2+=q});
   bar(n-1,0,c.npv,'var(--y26)',$M(c.npv),'NPV today');
   g.append($(`<div class="card"><h2>What happened to the NPV</h2><p class="note">$M at ${A.disc}%, underwriting case to where the deal stands. The five bars add to the whole difference.</p>${s+'</svg>'}</div>`))})();
  body.append(g);

  // sensitivity
  (function(){const GR=[2,3,4,5,6],EX=[2,2.5,3,3.5,4];
   const rows=GR.map(gv=>{const cells=EX.map(ev=>{const a=Object.assign({},A,{grow:gv,exit:ev});const s=stats(build(a).cur,a);
     const on=gv===A.grow&&Math.abs(ev-A.exit)<.01;
     return `<td class="${on?'hl':''}" style="color:${s.npv<0?'var(--bad)':'var(--ink)'}">${$M(s.npv)}</td>`}).join('');
    return `<tr><td>${gv}%</td>${cells}</tr>`}).join('');
   const irows=GR.map(gv=>{const cells=EX.map(ev=>{const a=Object.assign({},A,{grow:gv,exit:ev});const s=stats(build(a).cur,a);
     const on=gv===A.grow&&Math.abs(ev-A.exit)<.01;
     return `<td class="${on?'hl':''}" style="color:${s.irr<A.disc/100?'var(--bad)':'var(--ink)'}">${(s.irr*100).toFixed(1)}%</td>`}).join('');
    return `<tr><td>${gv}%</td>${cells}</tr>`}).join('');
   const hdr=`<tr><th>Growth \\ exit</th>${EX.map(e=>`<th>${e.toFixed(2)}×</th>`).join('')}</tr>`;
   const g2=document.createElement('div');g2.className='grid';
   g2.append($(`<div class="card"><h2>NPV sensitivity</h2><p class="note">$M at ${A.disc}%, forecast growth against the exit multiple. Red is value destroyed; the shaded cell is the case above.</p><div class="scroll"><table><thead>${hdr}</thead><tbody>${rows}</tbody></table></div></div>`));
   g2.append($(`<div class="card"><h2>IRR sensitivity</h2><p class="note">Same grid. Red is below the ${A.disc}% hurdle.</p><div class="scroll"><table><thead>${hdr}</thead><tbody>${irows}</tbody></table></div></div>`));
   body.append(g2)})();

  body.append($(`<div class="card"><h2>How this is built</h2><p class="note" style="margin:0">
   Cash at close is paid on 1 January ${Y0}; every other flow falls at the end of its year. Operating earnings are fee revenue less the support we provide and the firm's occupancy, taxed at ${A.tax}%, with no separate working capital or capital expenditure for a business of this kind.
   Payments to the partners run to ${A.eoEnd} and are treated as consideration rather than an operating cost, so the committed total is $${$M(c.inv)}M, or ${(c.inv/(M.rev.uw-M.support.uw-M.corp.uw)).toFixed(2)}× underwritten operating earnings; the exit multiple is set to the same ${A.exit.toFixed(2)}×, so nothing in the return comes from assuming the multiple expands.
   Moving those payments between operating cost and consideration does not change the IRR, because it is the same cash on the same dates; it changes the money multiple and what we say we paid, which is why the committed total is shown next to it.
   The underwriting case is the approved column from the P&amp;L tab, with ${Y0} at 60% for a part year, grown at the same ${A.grow}%.</p></div>`));
 }
 ctl.addEventListener('change',e=>{const k=e.target.dataset.k;if(!k)return;
  const n=+e.target.value;if(!isFinite(n))return;
  A[k]=k==='eoEnd'?Math.min(YN,Math.max(Y0,Math.round(n))):Math.max(k==='close'?0:0,n);
  e.target.value=A[k];render()});
 render();views.ret=v;
})();
